<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kickboard sim</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14161a; color: #cfd3da;
         font: 14px/1.4 system-ui, sans-serif; display: flex; height: 100vh; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #plan { flex: 3; display: block; cursor: crosshair; background: #14161a; min-height: 0; }
  #scope { flex: 2; display: block; background: #101216; border-top: 1px solid #2a2e36; min-height: 0; }
  #side { width: 300px; padding: 14px; box-sizing: border-box; overflow-y: auto;
          background: #1b1e24; border-left: 1px solid #2a2e36; }
  h1 { font-size: 15px; margin: 0 0 10px; color: #e8b25c; }
  .row { margin: 10px 0; }
  .row label { display: flex; justify-content: space-between; font-size: 12px;
               color: #9aa0ab; margin-bottom: 2px; }
  .row output { color: #e8b25c; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; }
  button { background: #2a2e36; color: #cfd3da; border: 1px solid #3a3f4a;
           border-radius: 4px; padding: 6px 10px; cursor: pointer; margin: 2px 2px 2px 0; }
  button:hover { background: #343946; }
  button.on { background: #6b4f1d; border-color: #e8b25c; }
  #status { font-size: 12px; color: #9aa0ab; white-space: pre-line;
            border-top: 1px solid #2a2e36; margin-top: 12px; padding-top: 10px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         margin-right: 5px; }
  .ok { background: #5dbb63; } .bad { background: #d05050; }
</style>
</head>
<body>
<div id="main">
  <canvas id="plan"></canvas>
  <canvas id="scope" title="live radar, sensor frame: sensor at the bottom, looking up"></canvas>
</div>
<div id="side">
  <h1>kickboard sim</h1>
  <div class="row"><label>pool width &sigma; <output id="o_sigma"></output></label>
    <input type="range" id="sigma_mm" min="300" max="800" step="10"></div>
  <div class="row"><label>peak <output id="o_peak"></output></label>
    <input type="range" id="peak" min="0" max="1" step="0.05"></div>
  <div class="row"><label>ambient <output id="o_ambient"></output></label>
    <input type="range" id="ambient" min="0" max="0.05" step="0.005"></div>
  <div class="row"><label>lag &tau; (s) <output id="o_tau"></output></label>
    <input type="range" id="ema_tau_s" min="0.05" max="0.5" step="0.01"></div>
  <div class="row"><label>colour temp (K) <output id="o_cct"></output></label>
    <input type="range" id="cct_k" min="2200" max="6500" step="50"></div>
  <div class="row"><label>sim target noise (mm) <output id="o_noise"></output></label>
    <input type="range" id="noise_mm" min="0" max="200" step="10" value="0"></div>
  <div class="row">
    <button id="clear">clear sim target</button>
    <button id="dropout">dropout 3 s</button>
  </div>
  <div class="row">
    <button id="enable" class="on">enabled</button>
    <button id="mode">mode: auto</button>
  </div>
  <div id="status">connecting&hellip;</div>
</div>
<script>
"use strict";
const canvas = document.getElementById("plan");
const ctx = canvas.getContext("2d");
let geo = null, state = null, view = null;
let simTarget = null;   // {x, y} in mm, or null
let dragging = false;

// ---- coordinate mapping: room mm <-> canvas px, y up ----
function fitView() {
  if (!geo) return;
  let pts = geo.room.slice();
  for (const n of Object.values(geo.nodes)) pts = pts.concat(n);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const lo = [Math.min(...xs) - 200, Math.min(...ys) - 200];
  const hi = [Math.max(...xs) + 200, Math.max(...ys) + 200];
  const w = canvas.width, h = canvas.height;
  const s = Math.min(w / (hi[0] - lo[0]), h / (hi[1] - lo[1]));
  view = { lo, s,
    ox: (w - s * (hi[0] - lo[0])) / 2,
    oy: (h - s * (hi[1] - lo[1])) / 2, hiY: hi[1] };
}
const toPx = (x, y) => [view.ox + (x - view.lo[0]) * view.s,
                        view.oy + (view.hiY - y) * view.s];
const toMm = (px, py) => [view.lo[0] + (px - view.ox) / view.s,
                          view.hiY - (py - view.oy) / view.s];

const scope = document.getElementById("scope");
const sctx = scope.getContext("2d");
function resize() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
  scope.width = scope.clientWidth * devicePixelRatio;
  scope.height = scope.clientHeight * devicePixelRatio;
  fitView();
}

// ---- live scopes: one panel per radar, raw detections in that sensor's
// frame (sensor at the bottom looking up), last 6 s trailing ----
const SCOPE_RANGE = 8000, SCOPE_HALF_FOV = 60;
function drawOneScope(x0, w, h, ip, rd) {
  const dp = devicePixelRatio;
  const ox = x0 + w / 2, oy = h - 14 * dp;
  const s = Math.min((h - 30 * dp) / SCOPE_RANGE, (w / 2 - 4 * dp) / (SCOPE_RANGE * Math.sin(SCOPE_HALF_FOV * Math.PI / 180)));
  const P = (x, y) => [ox + x * s, oy - y * s];
  sctx.fillStyle = "rgba(120,170,255,0.05)"; sctx.strokeStyle = "#2a2e36"; sctx.lineWidth = 1;
  sctx.beginPath(); sctx.moveTo(ox, oy);
  for (let a = -SCOPE_HALF_FOV; a <= SCOPE_HALF_FOV; a += 2) {
    const r = a * Math.PI / 180; const [x, y] = P(SCOPE_RANGE * Math.sin(r), SCOPE_RANGE * Math.cos(r)); sctx.lineTo(x, y);
  }
  sctx.closePath(); sctx.fill(); sctx.stroke();
  sctx.font = `${10 * dp}px system-ui`; sctx.fillStyle = "#5a606b"; sctx.textAlign = "left";
  for (let r = 1000; r <= SCOPE_RANGE; r += 1000) {
    sctx.beginPath();
    for (let a = -SCOPE_HALF_FOV; a <= SCOPE_HALF_FOV; a += 2) {
      const t = a * Math.PI / 180; const [x, y] = P(r * Math.sin(t), r * Math.cos(t));
      a === -SCOPE_HALF_FOV ? sctx.moveTo(x, y) : sctx.lineTo(x, y);
    }
    sctx.strokeStyle = "#22262d"; sctx.stroke();
    const [lx, ly] = P(0, r); sctx.fillText(`${r / 1000} m`, lx + 3, ly - 2);
  }
  sctx.fillStyle = "#78aaff"; sctx.fillRect(ox - 5 * dp, oy - 5 * dp, 10 * dp, 10 * dp);
  const stale = !rd || rd.age_s == null || rd.age_s > 2;
  if (rd) {
    for (const [age, x, y] of rd.recent) {
      const k = Math.max(0, 1 - age / 6);
      const [px, py] = P(x, y);
      sctx.fillStyle = `rgba(232,178,92,${0.08 + 0.5 * k})`;
      sctx.beginPath(); sctx.arc(px, py, (1.5 + 2 * k) * dp, 0, 7); sctx.fill();
    }
    if (!stale) for (const [x, y, v] of rd.last) {
      const [px, py] = P(x, y);
      sctx.fillStyle = "#ffd27a"; sctx.strokeStyle = "#14161a"; sctx.lineWidth = 2;
      sctx.beginPath(); sctx.arc(px, py, 6 * dp, 0, 7); sctx.fill(); sctx.stroke();
      sctx.fillStyle = "#cfd3da"; sctx.font = `${11 * dp}px system-ui`;
      sctx.fillText(`${(Math.hypot(x, y) / 1000).toFixed(2)} m  ${v} cm/s`, px + 9 * dp, py - 6 * dp);
    }
  }
  sctx.fillStyle = stale ? "#d05050" : "#9aa0ab"; sctx.font = `${11 * dp}px system-ui`;
  const head = rd ? `${rd.name}  ${ip}  ${rd.fps} fps  ${rd.last.length} target${rd.last.length === 1 ? "" : "s"}` +
                    (stale ? `  no frames for ${rd.age_s} s` : "")
                  : `${ip}  waiting for frames`;
  sctx.fillText(head, x0 + 8 * dp, 14 * dp);
}
function drawScope() {
  const w = scope.width, h = scope.height;
  sctx.clearRect(0, 0, w, h);
  const live = (state && state.radar) || {};
  // panels: every configured source, plus any unlisted sender that shows up
  const ips = [...new Set([...(geo && geo.radars ? geo.radars.map(r => r.ip) : []), ...Object.keys(live)])];
  if (ips.length === 0) { drawOneScope(0, w, h, "-", null); return; }
  const pw = w / ips.length;
  ips.forEach((ip, i) => {
    if (i) { sctx.strokeStyle = "#2a2e36"; sctx.beginPath(); sctx.moveTo(i * pw, 0); sctx.lineTo(i * pw, h); sctx.stroke(); }
    drawOneScope(i * pw, pw, h, ip, live[ip]);
  });
}
function draw() {
  requestAnimationFrame(draw);
  drawScope();
  if (!geo || !view) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // room polygon + exclusion zones
  ctx.strokeStyle = "#3a3f4a"; ctx.lineWidth = 2; ctx.beginPath();
  geo.room.forEach((p, i) => { const [x, y] = toPx(p[0], p[1]);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = "rgba(208,80,80,0.12)";
  for (const z of geo.zones || []) {
    ctx.beginPath();
    z.forEach((p, i) => { const [x, y] = toPx(p[0], p[1]);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath(); ctx.fill();
  }

  // radars: position, boresight arrow, field-of-view wedge per sensor
  // (sensor +Y is "forward"; room direction = R(theta) * (0, 1))
  for (const r of (geo.radars || (geo.radar ? [geo.radar] : []))) {
    const th = r.theta_deg * Math.PI / 180;
    const fx = -Math.sin(th), fy = Math.cos(th);          // forward unit vector
    const half = r.fov_deg / 2 * Math.PI / 180;
    const [sx, sy] = toPx(r.x, r.y);
    ctx.fillStyle = "rgba(120,170,255,0.06)";
    ctx.strokeStyle = "rgba(120,170,255,0.35)"; ctx.lineWidth = 1;
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(sx, sy);
    for (let a = -half; a <= half + 1e-6; a += Math.PI / 90) {
      const dx = fx * Math.cos(a) - fy * Math.sin(a), dy = fx * Math.sin(a) + fy * Math.cos(a);
      const [px, py] = toPx(r.x + dx * r.range_mm, r.y + dy * r.range_mm);
      ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    const [ax, ay] = toPx(r.x + fx * 400, r.y + fy * 400);   // 40 cm boresight arrow
    ctx.strokeStyle = "#78aaff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ax, ay); ctx.stroke();
    ctx.fillStyle = "#78aaff";
    ctx.fillRect(sx - 6, sy - 6, 12, 12);
    ctx.fillStyle = "#cfd3da"; ctx.font = "11px system-ui";
    ctx.fillText(`${r.name || "radar"} (${r.x}, ${r.y}) ${r.theta_deg.toFixed(0)}°`,
                 sx + 10, sy + 16);
  }

  // LEDs, coloured by live output (brightened so ambient is visible)
  if (state) for (const [name, xy] of Object.entries(geo.nodes)) {
    const node = state.nodes[name];
    for (let i = 0; i < xy.length; i++) {
      const r = node ? node.rgb[i * 3] : 0, g = node ? node.rgb[i * 3 + 1] : 0,
            b = node ? node.rgb[i * 3 + 2] : 0;
      const [px, py] = toPx(xy[i][0], xy[i][1]);
      ctx.fillStyle = (r || g || b)
        ? `rgb(${Math.min(255, 40 + r)},${Math.min(255, 40 + g)},${Math.min(255, 40 + b)})`
        : "#2a2e36";
      ctx.beginPath(); ctx.arc(px, py, 2.5, 0, 7); ctx.fill();
    }
  }

  // tracks: trail, raw (hollow) vs smoothed (solid), confidence as alpha
  if (state) for (const t of state.targets) {
    ctx.strokeStyle = "rgba(232,178,92,0.35)"; ctx.lineWidth = 1;
    ctx.beginPath();
    t.trail.forEach((p, i) => { const [x, y] = toPx(p[0], p[1]);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
    const [rx, ry] = toPx(t.raw_x, t.raw_y);
    ctx.strokeStyle = "rgba(120,170,255,0.8)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(rx, ry, 6, 0, 7); ctx.stroke();
    const [sx, sy] = toPx(t.x, t.y);
    ctx.fillStyle = `rgba(232,178,92,${0.25 + 0.75 * t.conf})`;
    ctx.beginPath(); ctx.arc(sx, sy, 8, 0, 7); ctx.fill();
    ctx.fillStyle = "#cfd3da"; ctx.font = "11px system-ui";
    ctx.fillText(`#${t.id} ${t.conf.toFixed(2)}${t.held ? " held" : ""}`,
                 sx + 11, sy - 6);
  }

  // sim target marker
  if (simTarget) {
    const [x, y] = toPx(simTarget.x, simTarget.y);
    ctx.strokeStyle = "#5dbb63"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 15, y); ctx.lineTo(x + 15, y);
    ctx.moveTo(x, y - 15); ctx.lineTo(x, y + 15); ctx.stroke();
  }
}

// ---- interaction: drag anywhere to place/move the sim target ----
function pointerMm(ev) {
  const r = canvas.getBoundingClientRect();
  return toMm((ev.clientX - r.left) * devicePixelRatio,
              (ev.clientY - r.top) * devicePixelRatio);
}
function pushSimTarget() {
  if (!simTarget) return;
  post("/api/sim_target", { active: true, x: simTarget.x, y: simTarget.y,
                            noise_mm: +document.getElementById("noise_mm").value });
}
canvas.addEventListener("pointerdown", ev => {
  dragging = true; canvas.setPointerCapture(ev.pointerId);
  const [x, y] = pointerMm(ev); simTarget = { x, y }; pushSimTarget();
});
canvas.addEventListener("pointermove", ev => {
  if (!dragging) return;
  const [x, y] = pointerMm(ev); simTarget = { x, y }; pushSimTarget();
});
canvas.addEventListener("pointerup", () => { dragging = false; });

// ---- controls ----
const post = (url, body) => fetch(url, { method: "POST",
  headers: { "content-type": "application/json" }, body: JSON.stringify(body) });

const sliders = ["sigma_mm", "peak", "ambient", "ema_tau_s", "cct_k"];
const outputs = { sigma_mm: "o_sigma", peak: "o_peak", ambient: "o_ambient",
                  ema_tau_s: "o_tau", cct_k: "o_cct" };
let editing = null;   // don't fight the server while a slider is held
for (const id of sliders) {
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", () => { editing = id; });
  el.addEventListener("pointerup", () => { editing = null; });
  el.addEventListener("input", () => {
    document.getElementById(outputs[id]).textContent = el.value;
    post("/api/params", { [id]: +el.value });
  });
}
document.getElementById("noise_mm").addEventListener("input", ev => {
  document.getElementById("o_noise").textContent = ev.target.value;
  pushSimTarget();
});
document.getElementById("clear").addEventListener("click", () => {
  simTarget = null; post("/api/sim_target", { active: false });
});
document.getElementById("dropout").addEventListener("click",
  () => post("/api/dropout", { seconds: 3 }));
document.getElementById("enable").addEventListener("click", () =>
  post("/api/params", { enabled: !(state && state.params.enabled) }));
document.getElementById("mode").addEventListener("click", () =>
  post("/api/params",
       { mode: state && state.params.mode === "auto" ? "manual" : "auto" }));

function syncControls() {
  if (!state) return;
  for (const id of sliders) {
    if (editing === id) continue;
    const el = document.getElementById(id);
    el.value = state.params[id === "cct_k" ? "cct_k" : id];
    document.getElementById(outputs[id]).textContent = (+el.value).toFixed(
      id === "peak" ? 2 : id === "ambient" ? 3 : id === "ema_tau_s" ? 2 : 0);
  }
  const en = document.getElementById("enable");
  en.classList.toggle("on", state.params.enabled);
  en.textContent = state.params.enabled ? "enabled" : "disabled";
  document.getElementById("mode").textContent = "mode: " + state.params.mode;
  const dot = c => `<span class="dot ${c ? "ok" : "bad"}"></span>`;
  const est = Object.entries(state.stats)
    .map(([n, s]) => `${n}: ${s.est_ma} mA${s.clamped ? " CLAMPED" : ""}`)
    .join("\n");
  document.getElementById("status").innerHTML =
    `${dot(state.radar_alive)}radar ${state.radar_alive ? "alive" : "silent"}\n` +
    `${dot(state.occupancy)}occupancy ${state.occupancy}\n` +
    `master ${state.master}  targets ${state.targets.length}\n` + est +
    (state.sim.dropout_s > 0 ? `\ndropout ${state.sim.dropout_s.toFixed(1)} s` : "");
}

// ---- data ----
async function loadGeo() {
  geo = await (await fetch("/api/geometry")).json();
  resize();
}
function connect() {
  const ws = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onmessage = ev => { state = JSON.parse(ev.data); syncControls(); };
  ws.onclose = () => {
    document.getElementById("status").textContent = "disconnected, retrying…";
    setTimeout(connect, 1500);
  };
}
loadGeo().then(() => { connect(); requestAnimationFrame(draw); });
</script>
</body>
</html>
