# Dashboard provider — every JSON under /var/lib/grafana/dashboards is loaded
# (and reloaded on change). Dashboards are generated by grafana/build_dashboards.py;
# edit the builder, not the JSON, then run grafana/deploy.sh.
apiVersion: 1
providers:
  - name: energy
    folder: Energy
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
