esphome:
  name: nixie-soc-display
  friendly_name: Nixie SoC Display

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:

external_components:
  - source: github://oxan/esphome-stream-server

# Seeed XIAO ESP32-C6 <-> nixie AVR:
#   D6 = GPIO16 = TX  -> AVR RX (pin 30)
#   D7 = GPIO17 = RX  <- AVR TX (pin 31) via 2.2k/3.3k divider
#   D8 = GPIO19       -> AVR RESET (back-side RST pad) via 1k, open-drain
uart:
  id: nixie_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 57600

# avrdude flashes the AVR over WiFi through this port:
#   avrdude -c arduino -p m328p -P net:nixie-soc-display.local:6638
# On client connect: baud -> 115200 (Optiboot), pulse AVR reset, pause SoC
# updates. On disconnect: baud -> 57600, updates resume.
stream_server:
  uart_id: nixie_uart
  port: 6638
  buffer_size: 1024

binary_sensor:
  - platform: stream_server
    connected:
      id: flash_client
      name: "AVR flash client connected"
      on_press:
        # bootloader runs at 57600, same as the app - no baud switch needed
        - lambda: |-                       # drop stale bytes before reset
            uint8_t b;
            while (id(nixie_uart).available()) id(nixie_uart).read_byte(&b);
        - output.turn_on: avr_reset_out    # pull RESET low
        - delay: 100ms
        - output.turn_off: avr_reset_out   # release -> Optiboot runs
        - delay: 300ms
        - lambda: |-                       # drop reset-transient garbage
            uint8_t b;
            while (id(nixie_uart).available()) id(nixie_uart).read_byte(&b);


output:
  - platform: gpio
    id: avr_reset_out
    pin:
      number: GPIO19
      inverted: true          # turn_on = drive LOW (reset asserted)
      mode:
        output: true
        open_drain: true      # released state floats; AVR's own pullup wins

button:
  - platform: template
    name: "AVR reset"
    on_press:
      - output.turn_on: avr_reset_out
      - delay: 100ms
      - output.turn_off: avr_reset_out
  - platform: template
    name: "Nixie demo mode"
    on_press:
      - lambda: |-
          if (!id(flash_client).state) id(nixie_uart).write_str("X\n");
  - platform: template
    name: "Nixie poison sweep"
    on_press:
      - lambda: |-
          if (!id(flash_client).state) id(nixie_uart).write_str("S\n");

select:
  - platform: template
    name: "Nixie LED animation"
    id: led_anim
    options: ["Off", "Wave", "Comet", "Fill", "Flow"]
    initial_option: "Off"
    restore_value: true
    optimistic: true
    on_value:
      - lambda: |-
          if (id(flash_client).state) return;
          const char* c = x == "Wave" ? "A1\n" : x == "Comet" ? "A2\n"
                        : x == "Fill" ? "A3\n" : x == "Flow" ? "A4\n" : "A0\n";
          id(nixie_uart).write_str(c);
  - platform: template
    name: "Nixie display mode"
    id: display_mode
    options: ["SoC walk", "Load + SoC"]
    initial_option: "SoC walk"
    restore_value: true
    optimistic: true

number:
  - platform: template
    name: "Nixie animation speed"
    id: anim_speed
    min_value: 1
    max_value: 9
    step: 1
    initial_value: 6
    restore_value: true
    optimistic: true
  - platform: template
    name: "Nixie tube brightness"
    id: tube_brightness
    min_value: 0
    max_value: 9
    step: 1
    initial_value: 9
    restore_value: true
    optimistic: true
  - platform: template
    name: "Nixie LED brightness"
    id: led_brightness
    min_value: 0
    max_value: 9
    step: 1
    initial_value: 9
    restore_value: true
    optimistic: true

sensor:
  - platform: homeassistant
    id: ha_soc
    entity_id: sensor.foxess_foxctl_battery_soc
  - platform: homeassistant
    id: ha_charge
    entity_id: sensor.foxess_foxctl_battery_charge_power
  - platform: homeassistant
    id: ha_discharge
    entity_id: sensor.foxess_foxctl_battery_discharge_power
  - platform: homeassistant
    id: ha_load
    entity_id: sensor.circuits_total_power   # watts, local clamps
  - platform: homeassistant
    id: ha_solar
    entity_id: sensor.foxess_foxctl_solar_power
  - platform: homeassistant
    id: ha_grid
    entity_id: sensor.grid_main_power_local  # watts, +import / -export

# Protocol: "SSSPPPD\n" - SoC 3 digits, |net power| in 0.1kW 3 digits,
# direction char (C=charging, D=discharging). e.g. "065012C" = 65%, 1.2kW in.
interval:
  - interval: 10s
    then:
      - lambda: |-
          if (id(flash_client).state) return;   // don't write during a flash
          int soc = (int) round(id(ha_soc).state);
          if (soc < 0) soc = 0;
          if (soc > 100) soc = 100;
          float net_kw = id(ha_charge).state - id(ha_discharge).state;
          int net_tenths = (int) round(fabs(net_kw) * 10.0);
          if (net_tenths > 999) net_tenths = 999;
          char dir = (net_kw >= 0) ? 'C' : 'D';
          char bright = '0' + (int) id(led_brightness).state;
          char mode = (id(display_mode).state == "Load + SoC") ? '1' : '0';
          float load_w = id(ha_load).state;
          int load_tenths = isnan(load_w) ? 0 : (int) round(load_w / 100.0);
          if (load_tenths < 0) load_tenths = 0;
          if (load_tenths > 999) load_tenths = 999;
          float grid_w = id(ha_grid).state;
          int grid_tenths = isnan(grid_w) ? 0 : (int) round(fabs(grid_w) / 100.0);
          if (grid_tenths > 999) grid_tenths = 999;
          char gsign = (!isnan(grid_w) && grid_w < 0) ? 'E' : 'I';
          // solar derived from conservation: load + net battery - grid import.
          // local clamps are live; the cloud solar sensor lags minutes behind.
          float solar_w;
          if (!isnan(load_w) && !isnan(grid_w)) {
            solar_w = load_w + net_kw * 1000.0 - grid_w;
          } else {
            solar_w = id(ha_solar).state;   // cloud fallback
          }
          int solar_tenths = isnan(solar_w) ? 0 : (int) round(solar_w / 100.0);
          if (solar_tenths < 0) solar_tenths = 0;
          if (solar_tenths > 999) solar_tenths = 999;
          char buf[26];
          char tbright = '0' + (int) id(tube_brightness).state;
          char anim = id(led_anim).state == "Wave" ? '1'
                    : id(led_anim).state == "Comet" ? '2'
                    : id(led_anim).state == "Fill" ? '3'
                    : id(led_anim).state == "Flow" ? '4' : '0';
          char aspd = '0' + (int) id(anim_speed).state;
          snprintf(buf, sizeof(buf), "%03d%03d%c%c%c%03d%c%03d%03d%c%c%c\n",
                   soc, net_tenths, dir, bright, mode, load_tenths,
                   gsign, grid_tenths, solar_tenths, tbright, anim, aspd);
          id(nixie_uart).write_str(buf);
          ESP_LOGI("nixie", "soc=%.1f chg=%.2f dis=%.2f -> %s",
                   id(ha_soc).state, id(ha_charge).state, id(ha_discharge).state, buf);
