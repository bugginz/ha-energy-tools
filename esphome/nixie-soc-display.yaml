esphome:
  name: nixie-soc-display
  friendly_name: Nixie SoC Display

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:

external_components:
  - source: github://oxan/esphome-stream-server

# Seeed XIAO ESP32-C6 <-> nixie AVR:
#   D6 = GPIO16 = TX  -> AVR RX (pin 30)
#   D7 = GPIO17 = RX  <- AVR TX (pin 31) via 2.2k/3.3k divider
#   D8 = GPIO19       -> AVR RESET (back-side RST pad) via 1k, open-drain
uart:
  id: nixie_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 57600

# avrdude flashes the AVR over WiFi through this port:
#   avrdude -c arduino -p m328p -P net:nixie-soc-display.local:6638
# On client connect: baud -> 115200 (Optiboot), pulse AVR reset, pause SoC
# updates. On disconnect: baud -> 57600, updates resume.
stream_server:
  uart_id: nixie_uart
  port: 6638
  buffer_size: 1024

binary_sensor:
  - platform: stream_server
    connected:
      id: flash_client
      name: "AVR flash client connected"
      on_press:
        - lambda: |-
            id(nixie_uart).set_baud_rate(115200);
            id(nixie_uart).load_settings();
        - output.turn_on: avr_reset_out    # pull RESET low
        - delay: 100ms
        - output.turn_off: avr_reset_out   # release -> Optiboot runs
      on_release:
        - lambda: |-
            id(nixie_uart).set_baud_rate(57600);
            id(nixie_uart).load_settings();

output:
  - platform: gpio
    id: avr_reset_out
    pin:
      number: GPIO19
      inverted: true          # turn_on = drive LOW (reset asserted)
      mode:
        output: true
        open_drain: true      # released state floats; AVR's own pullup wins

button:
  - platform: template
    name: "AVR reset"
    on_press:
      - output.turn_on: avr_reset_out
      - delay: 100ms
      - output.turn_off: avr_reset_out

sensor:
  - platform: homeassistant
    id: ha_soc
    entity_id: sensor.foxess_foxctl_battery_soc
  - platform: homeassistant
    id: ha_charge
    entity_id: sensor.foxess_foxctl_battery_charge_power
  - platform: homeassistant
    id: ha_discharge
    entity_id: sensor.foxess_foxctl_battery_discharge_power

# Protocol: "SSSPPPD\n" - SoC 3 digits, |net power| in 0.1kW 3 digits,
# direction char (C=charging, D=discharging). e.g. "065012C" = 65%, 1.2kW in.
interval:
  - interval: 10s
    then:
      - lambda: |-
          if (id(flash_client).state) return;   // don't write during a flash
          int soc = (int) round(id(ha_soc).state);
          if (soc < 0) soc = 0;
          if (soc > 100) soc = 100;
          float net_kw = id(ha_charge).state - id(ha_discharge).state;
          int net_tenths = (int) round(fabs(net_kw) * 10.0);
          if (net_tenths > 999) net_tenths = 999;
          char dir = (net_kw >= 0) ? 'C' : 'D';
          char buf[16];
          snprintf(buf, sizeof(buf), "%03d%03d%c\n", soc, net_tenths, dir);
          id(nixie_uart).write_str(buf);
          ESP_LOGI("nixie", "soc_raw=%.1f charge=%.2f discharge=%.2f -> sent: %s",
                   id(ha_soc).state, id(ha_charge).state, id(ha_discharge).state, buf);
